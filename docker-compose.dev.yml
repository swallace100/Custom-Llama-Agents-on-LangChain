services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - ./apps/api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks: [appnet]

  demo:
    build:
      context: .
      dockerfile: apps/demo/Dockerfile.dev
    working_dir: /repo/apps/demo
    ports:
      - "5173:5173"         # Vite dev server
    volumes:
      - ./apps/demo:/repo/apps/demo
      - /repo/apps/demo/node_modules
    command: sh -c "pnpm install && pnpm dev -- --host 0.0.0.0"
    depends_on:
      api:
        condition: service_healthy
    networks: [appnet]

  llm:
    build:
      context: ./apps/llm_host_py
      dockerfile: Dockerfile
    ports:
      - "7001:7001"
    environment:
      - ADAPTERS_DIR=/app/adapters
      - HF_HOME=/root/.cache/huggingface
      - BASE_MODEL=microsoft/phi-3-mini-4k-instruct
    gpus: all
    volumes:
      - ./apps/llm_host_py:/app
      - ./apps/llm_host_py/adapters:/app/adapters
      - ./.hf_cache:/root/.cache/huggingface
    networks: [appnet]

networks:
  appnet: {}
