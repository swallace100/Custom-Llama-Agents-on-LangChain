services:
  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    ports: ["8080:8080"]
    env_file: ["../.env"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 20s
      timeout: 5s
      retries: 5

  demo:
    build:
      context: ..
      dockerfile: infra/docker/demo.Dockerfile
    ports: ["8085:8085"]
    depends_on:
      api:
        condition: service_healthy
