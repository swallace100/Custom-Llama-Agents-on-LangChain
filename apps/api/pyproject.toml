[project]
name = "api"
version = "0.1.0"
description = "FastAPI service for orchestrating Phi-3 agents"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.111","uvicorn[standard]>=0.30","pydantic>=2.7"]

[tool.uv]
dev-dependencies = ["pytest", "ruff", "mypy", "black"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
