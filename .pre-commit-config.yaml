repos:
  - repo: https://github.com/psf/black
    rev: 25.9.0
    hooks:
      - id: black

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.2
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"] # auto-fix & fail only if something unfixable
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        additional_dependencies: [] # add stubs here if needed later

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: detect-private-key

  - repo: local
    hooks:
      - id: validate-role-datasets
        name: validate role datasets
        language: system
        entry: python
        args:
          - packages/evals/datasets/tools/validate.py
          - packages/evals/datasets/researcher.jsonl
          - packages/evals/datasets/writer.jsonl
          - packages/evals/datasets/editor.jsonl
        pass_filenames: false
        verbose: true
