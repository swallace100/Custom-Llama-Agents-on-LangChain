[tool.black]
line-length = 100
target-version = ["py311","py312","py313"]
skip-string-normalization = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Enable isort rules (I), pyflakes (F), pycodestyle (E/W), and a few niceties.
extend-select = ["I", "F", "E", "W", "UP", "B"]
ignore = [
  # noisy/optional rules can go here later
]

[tool.ruff.lint.isort]
known-first-party = ["agents", "tools", "memory", "evals", "api"]
combine-as-imports = true

[tool.ruff.format]
# Keep black as primary formatter; ruff-format only normalizes trivia (quotes, etc.).
quote-style = "preserve"
